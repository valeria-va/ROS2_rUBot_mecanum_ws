<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ROS Web Dashboard</title>
	<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 20px;
			background-color: #414141;
			color: #e6e6e6;
		}

		.dashboard {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
		}

		.connection-form {
			width: 100%;
			margin-bottom: 20px;
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: center;
		}
		.connection-form label { color: #fff; }
		.connection-form input[type="number"] {
			width: 70px;
			padding: 6px 8px;
			border-radius: 6px;
			border: 1px solid #bbb;
			background: #fff;
		}
		.connection-form button {
			padding: 8px 14px;
			border-radius: 6px;
			border: 1px solid #bbb;
			background: #f5f5f5;
			cursor: pointer;
		}
		.connection-form button:hover { filter: brightness(0.97); }
		.connection-form button.connected {
			background: #2ecc71;
			border-color: #2ecc71;
			color: #fff;
		}

		.joystick-container {
			width: 200px;
			height: 200px;
			background-color: #ddd;
			border-radius: 50%;
			position: relative;
			overflow: hidden;
			touch-action: none;
		}

		.image-view {
			width: 330px;
			height: 240px;
			background-color: #000;
			border: 1px solid #ccc;
			border-radius: 5px;
		}

		.position-display,
		.map-display,
		.rviz-map-display,
		.readings-display,
		.eco2-legend {
			padding: 10px;
			background-color: #fff;
			border-radius: 5px;
			color: #333;
			box-sizing: border-box;
		}
		
		.position-display h3,
		.map-display h3,
		.rviz-map-display h3,
		.readings-display h3,
		.eco2-legend h3 {
			margin-top: 0;
			color: #111;
		}

		.position-display {
			width: 200px;
		}

		.map-display,
		.rviz-map-display {
			width: 330px;
		}

		.eco2-legend {
			padding: 10px;
			border-radius: 5px;
			width: 100px;
			height: 300px;
			text-align: center;
		}

		.eco2-legend h3 {
			margin: 0 0 40px 0;
			font-size: 1em;
		}

		.legend-body {
			display: flex;
			flex-direction: row;
			justify-content: center;
			height: 150px;
		}

		.legend-gradient {
			width: 25px;
			height: 100%;
			border: 1px solid #888;
			background: linear-gradient(to top, #70fdff, #7bff7b, #f6ff53, #ffca61, #ff4343);
		}

		.legend-labels {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 100%;
			margin-left: 10px;
			font-size: 0.9em;
		}

		.readings-display {
			min-width: 500px;
			background-color: #f0f0f0;
		}

		.readings-container {
			min-height: 200px;
			padding: 5px;
			overflow-y: auto;
		}

		.readings-container ul {
			list-style-type: none;
			padding: 0;
			margin: 5px 0 5px 10px;
			columns: 3;
		}

		.readings-container li {
			font-size: 0.9em;
			padding: 1px 0;
		}

		.sensor-channel {
			margin-bottom: 10px;
			border: 1px solid #00000030;
			padding: 5px;
			border-radius: 3px;
			background-color: #f9f9f9;
		}

		.map-image {
			width: 100%;
			height: auto;
			border: 1px solid #ccc;
			border-radius: 5px;
			background-color: #e6e6e6;
		}

		#rviz-canvas {
			width: 300px;
			height: 300px;
			border: 1px solid #ccc;
			border-radius: 5px;
			display: block;
			background-color: #e6e6e6;
		}
		
		.right-panel {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 8px;
			padding: 10px;
		}

		.joy-legend {
			font-size: 1rem;
			font-weight: 700;
			color: #eee;
			text-align: center;
			margin-top: 0;
		}

		.omega-wrap {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			color: #eee;
			font-size: 0.95rem;
			width: 100%;
		}

		.joy-vel {
			font-size: 0.9rem;
			color: #ddd;
			text-align: center;
		}
	</style>
</head>

<body>
	<div class="connection-form">
		<label for="robotNumber">Robot:</label>
		<input id="robotNumber" type="number" min="1" max="9" value="1" title="Robot number" />
		<button id="connectBtn" onclick="connectToROS()">Connect</button>
	</div>
	
	<div class="dashboard">
		<aside class="right-panel">
			<div class="joy-legend">Joystick</div>
			<div class="joystick-container" id="joystick_h"></div>
			<div class="omega-wrap">
				<label for="omegaSlider">ω𝓏:</label>
				<input id="omegaSlider" type="range" min="-1" max="1" step="0.01" value="0" />
				<span id="omegaVal">0.00</span> rad/s
			</div>
			<div class="joy-vel">
				vₓ: <span id="vx">0.00</span> m/s · vᵧ: <span id="vy">0.00</span> m/s
			</div>
		</aside>

		<img class="image-view" id="camera-feed" alt="Camera Feed">

		<div class="position-display">
			<h3>Position & Orientation</h3>
			<p>X: <span id="position-x">0</span></p>
			<p>Y: <span id="position-y">0</span></p>
			<p>&Theta; (º): <span id="rotation-z">0</span></p> 
		</div>

		<div class="map-display">
			<h3>Map</h3>
			<canvas id="map-canvas" class="map-image" width="200" height="200"></canvas>
		</div>

		<div class="eco2-legend">
			<h3>eCO2 (ppm)</h3>
			<div class="legend-body">
				<div class="legend-gradient"></div>
				<div class="legend-labels">
					<span>2000+</span>
					<span>1200</span>
					<span>400</span>
				</div>
			</div>
		</div>

		<div class="rviz-map-display">
			<h3>LiDAR Map</h3>
			<canvas id="rviz-canvas" width="200" height="200"></canvas>
		</div>

		<div class="readings-display">
			<h3>Sensor Readings (ENS160)</h3>
			<div class="readings-container" id="readings">Awaiting Data...</div>
		</div>
	</div>

	<script>
		let ros;
		let cmdVelTopic;
		let joystick_h;
		let lidarPoints = null;

		let eCO2DataPoints = [];
		let currentRobotPos = { x: 0, y: 0 };
		let currentECO2 = null;

		const MAP_RESOLUTION = 0.01; // m/píxel 
		const ROBOT_RADIUS = 5;      // píxels (al canvas)
		const SPEED_VECTOR_SCALE = 100; // píxels per (m/s)
		
		let mapImage = new Image();

		const LIDAR_POINT_SIZE = 3;
		const LIDAR_COLOR = 'rgba(255, 0, 0, 0.8)';

		const ECO2_MIN = 400;
		const ECO2_MAX = 2000;
		const ECO2_POINT_RADIUS = 3;

		const EXPECTED_KEYS = ['eCO2', 'TVOC', 'AQI', 'R0', 'R1', 'R2', 'R3'];
		const KEYS_PER_CHANNEL = EXPECTED_KEYS.length;
		const MAX_CHANNELS = 6;
		
		const maxSpeed = 0.3;
		const maxTurn = 0.4;
		const distanceFactor = 75;
		
		let currentLinearX = 0;
		let currentLinearY = 0;
		let currentAngularZ = 0;

		function getRosbridgeAddress() {
			const currentUrl = window.location.href;
			const rosbridgeUrl = currentUrl.replace(/\/webpage\/?$/, '/rosbridge/');
			const rosbridgeAddress = rosbridgeUrl.replace(/^http/, 'ws').replace(/^https/, 'wss');
			return rosbridgeAddress;
		}

		function connectToROS() {
			if (ros && ros.isConnected) {
				console.log('Ja estàs connectat.');
				return;
			}
			document.getElementById('connectBtn')?.setAttribute('disabled', 'disabled');
			const robotNum = parseInt(document.getElementById('robotNumber').value) || 1;

			const mapName = "map";
			const mapPath = `maps/${mapName}.png`;

			const host = window.location.hostname;
			const scheme = location.protocol === 'https:' ? 'wss' : 'ws';

			let rosbridgeAddress;
			if (host.startsWith("192.168.1.")) {
				const lastOctet = robotNum * 10 + 4;
				const robotHost = `192.168.1.${lastOctet}`;
				rosbridgeAddress = `${scheme}://${robotHost}:9090`;
			} else {
				rosbridgeAddress = getRosbridgeAddress();
			}
			console.log("Connecting to:", rosbridgeAddress);

			// Using the responsive canvas resizer
			resizeAllCanvases();
			mapImage.onload = () => {
				resizeAllCanvases();
				console.log('Map image loaded & canvases resized.');
			};
			mapImage.src = mapPath;

			ros = new ROSLIB.Ros({
				url: rosbridgeAddress
			});

			const connectBtn = document.getElementById('connectBtn');
			ros.on('connection', function () {
				console.log('Connected to rosbridge:', rosbridgeAddress);
				if (connectBtn) connectBtn.classList.add('connected');
				setupTopics();
				setupControls();
				document.getElementById('connectBtn')?.removeAttribute('disabled');
				ros.isConnected = true;
			});

			ros.on('error', function (error) {
				console.error('Connection Error:', error);
				if (connectBtn) connectBtn.classList.remove('connected');
				document.getElementById('connectBtn')?.removeAttribute('disabled');
				ros.isConnected = false;
			});

			ros.on('close', function () {
				console.log('Connection closed.');
				if (connectBtn) connectBtn.classList.remove('connected');
				document.getElementById('connectBtn')?.removeAttribute('disabled');
				ros.isConnected = false;
			});
		}

		function quaternionToYaw(orientation) {
			const q = orientation;
			const siny_cosp = 2 * (q.w * q.z + q.x * q.y);
			const cosy_cosp = 1 - 2 * (q.y * q.y + q.z * q.z);
			const yaw = Math.atan2(siny_cosp, cosy_cosp);
			return yaw;
		}

		function setupTopics() {
			cmdVelTopic = new ROSLIB.Topic({
				ros: ros,
				name: '/cmd_vel',
				messageType: 'geometry_msgs/Twist'
			});

			const imageTopic = new ROSLIB.Topic({
				ros: ros,
				name: '/image_raw/compressed',
				messageType: 'sensor_msgs/CompressedImage'
			});

			imageTopic.subscribe(function (message) {
				document.getElementById('camera-feed').src = "data:image/jpeg;base64," + message.data;
			});

			const odomTopic = new ROSLIB.Topic({
				ros: ros,
				name: '/odom',
				messageType: 'nav_msgs/Odometry'
			});

			odomTopic.subscribe(function (message) {
				const position = message.pose.pose.position;
				const orientation = message.pose.pose.orientation;
				const twist = message.twist.twist;

				currentRobotPos.x = position.x;
				currentRobotPos.y = position.y;

				document.getElementById('position-x').textContent = position.x.toFixed(2);
				document.getElementById('position-y').textContent = position.y.toFixed(2);
				
				const yaw = quaternionToYaw(orientation);
				const yawDeg = yaw * 180 / Math.PI; // graus
				document.getElementById('rotation-z').textContent = yawDeg.toFixed(1);

				const velX_robot = twist.linear.x;
				const velY_robot = twist.linear.y;

				const velX_global = velX_robot * Math.cos(yaw) - velY_robot * Math.sin(yaw);
				const velY_global = velX_robot * Math.sin(yaw) + velY_robot * Math.cos(yaw);

				drawRobotState(position.x, position.y, velX_global, velY_global, yaw);
				drawLidarScan();
			});

			const scanTopic = new ROSLIB.Topic({
				ros: ros,
				name: '/scan',
				messageType: 'sensor_msgs/LaserScan'
			});

			scanTopic.subscribe(function (message) {
				lidarPoints = {
					ranges: message.ranges,
					angle_min: message.angle_min,
					angle_increment: message.angle_increment,
					range_max: message.range_max
				};
			});

			const sensorTopic = new ROSLIB.Topic({
				ros: ros,
				name: 'ens160_fused_data',
				messageType: 'ens160_interfaces/msg/SensorData'
			});

			sensorTopic.subscribe(function (message) {
				updateSensorDisplay(message.sensor_readings);

				const ch0_eco2_index = EXPECTED_KEYS.indexOf('eCO2');
				if (message.sensor_readings.length > ch0_eco2_index) {
					const newECO2 = message.sensor_readings[ch0_eco2_index];
					currentECO2 = newECO2;
					eCO2DataPoints.push({ x: currentRobotPos.x, y: currentRobotPos.y, eco2: newECO2 });
				}
			});
		}

		function updateSensorDisplay(readings) {
			const container = document.getElementById('readings');
			container.innerHTML = '';

			if (readings.length === 0) {
				container.innerHTML = '<p>No sensor data received.</p>';
				return;
			}

			const receivedChannels = Math.floor(readings.length / KEYS_PER_CHANNEL);

			if (readings.length % KEYS_PER_CHANNEL !== 0 || receivedChannels > MAX_CHANNELS) {
				container.innerHTML = `<p style="color: red;">Error in data structure: ${readings.length} readings received, not a multiple of ${KEYS_PER_CHANNEL} or exceeds ${MAX_CHANNELS} channels.</p>`;
				return;
			}

			let htmlContent = '';
			for (let i = 0; i < receivedChannels; i++) {
				const channelName = `CH${i}`;
				htmlContent += `<div class="sensor-channel"><strong>${channelName}</strong>:<ul>`;
				for (let j = 0; j < KEYS_PER_CHANNEL; j++) {
					const key = EXPECTED_KEYS[j];
					const index = i * KEYS_PER_CHANNEL + j;
					const value = readings[index] !== undefined ? readings[index].toFixed(2) : "N/A";
					htmlContent += `<li>${key}: ${value}</li>`;
				}
				htmlContent += `</ul></div>`;
			}
			container.innerHTML = htmlContent;
		}

		function getECO2Color(eco2) {
			let val = (eco2 - ECO2_MIN) / (ECO2_MAX - ECO2_MIN);
			val = Math.max(0, Math.min(1, val));
			let r = 0, g = 0, b = 0;
			if (val < 0.25) {
				r = 0; g = val * 4 * 255; b = 255;
			} else if (val < 0.5) {
				r = 0; g = 255; b = 255 - (val - 0.25) * 4 * 255;
			} else if (val < 0.75) {
				r = (val - 0.5) * 4 * 255; g = 255; b = 0;
			} else {
				r = 255; g = 255 - (val - 0.75) * 4 * 255; b = 0;
			}
			return `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, 0.7)`;
		}

		function drawECO2Heatmap(ctx, W, H) {
			for (const point of eCO2DataPoints) {
				const pixelX = point.x / MAP_RESOLUTION + W / 2;
				const pixelY = H / 2 - point.y / MAP_RESOLUTION;
				const color = getECO2Color(point.eco2);

				ctx.beginPath();
				ctx.arc(pixelX, pixelY, ECO2_POINT_RADIUS, 0, Math.PI * 2);
				ctx.fillStyle = color;
				ctx.fill();
			}
		}

		function resizeCanvas(canvasId) {
			const canvas = document.getElementById(canvasId);
			if (!canvas) return;
			const dpr = window.devicePixelRatio || 1;
			const cssW = canvas.clientWidth;
			const cssH = canvas.clientHeight;
			canvas.width = Math.round(cssW * dpr);
			canvas.height = Math.round(cssH * dpr);
			const ctx = canvas.getContext('2d');
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		}
		
		function resizeAllCanvases() {
			resizeCanvas('map-canvas');
			resizeCanvas('rviz-canvas');
		}

		function drawRobotState(robotX, robotY, velX, velY, yaw) {
			const canvas = document.getElementById('map-canvas');
			if (!canvas) return;
			const ctx = canvas.getContext('2d');

			const W = canvas.clientWidth;
			const H = canvas.clientHeight;

			ctx.clearRect(0, 0, W, H);
			if (mapImage.complete) {
				ctx.drawImage(mapImage, 0, 0, W, H);
			}
			
			// --- MERGED: Added heatmap draw ---
			drawECO2Heatmap(ctx, W, H);
			// ---

			// (0,0) al centre del canvas
			const pixelX = robotX / MAP_RESOLUTION + W / 2;
			const pixelY = H / 2 - robotY / MAP_RESOLUTION;

			// Robot
			ctx.beginPath();
			ctx.arc(pixelX, pixelY, ROBOT_RADIUS, 0, Math.PI * 2);
			ctx.fillStyle = 'green';
			ctx.fill();
			ctx.strokeStyle = 'black';
			ctx.stroke();

			// Orientació
			const orientationLength = ROBOT_RADIUS * 1.5;
			const endYawX = pixelX + Math.cos(yaw) * orientationLength;
			const endYawY = pixelY - Math.sin(yaw) * orientationLength; // Y is inverted in canvas
			ctx.beginPath();
			ctx.moveTo(pixelX, pixelY);
			ctx.lineTo(endYawX, endYawY);
			ctx.lineWidth = 2;
			ctx.strokeStyle = 'blue';
			ctx.stroke();

			// Vector velocitat global
			const speed = Math.hypot(velX, velY);
			if (speed > 0.01) {
				const movementAngle = Math.atan2(velY, velX);
				const vectorLength = speed * SPEED_VECTOR_SCALE;
				const endX = pixelX + Math.cos(movementAngle) * vectorLength;
				const endY = pixelY - Math.sin(movementAngle) * vectorLength; // Y is inverted

				ctx.beginPath();
				ctx.moveTo(pixelX, pixelY);
				ctx.lineTo(endX, endY);
				ctx.lineWidth = 2;
				ctx.strokeStyle = 'red';
				ctx.stroke();

				// Fletxa
				ctx.fillStyle = 'red';
				ctx.save();
				ctx.translate(endX, endY);
				ctx.rotate(-movementAngle);
				ctx.beginPath();
				ctx.moveTo(0, 0);
				ctx.lineTo(-10, 5);
				ctx.lineTo(-10, -5);
				ctx.closePath();
				ctx.fill();
				ctx.restore();
			}
		}
		
		function drawLidarScan() {
			const canvas = document.getElementById('rviz-canvas');
			if (!canvas) return;
			const ctx = canvas.getContext('2d');
			
			const W = canvas.clientWidth;
			const H = canvas.clientHeight;
			const center_X = W / 2;
			const center_Y = H / 2;

			ctx.clearRect(0, 0, W, H);

			if (lidarPoints && lidarPoints.ranges && lidarPoints.ranges.length > 0) {
				ctx.save();
				ctx.translate(center_X, center_Y);
				ctx.fillStyle = LIDAR_COLOR;
				ctx.beginPath();

				for (let i = 0; i < lidarPoints.ranges.length; i++) {
					const range = lidarPoints.ranges[i];
					if (isFinite(range) && range > 0.01 && range < lidarPoints.range_max) {
						const angle = lidarPoints.angle_min + i * lidarPoints.angle_increment;
						const pointX_rel_m = range * Math.cos(angle);
						const pointY_rel_m = range * Math.sin(angle);
						const pixelX = pointX_rel_m / MAP_RESOLUTION;
						const pixelY = -pointY_rel_m / MAP_RESOLUTION;
						ctx.rect(pixelX - LIDAR_POINT_SIZE / 2, pixelY - LIDAR_POINT_SIZE / 2, LIDAR_POINT_SIZE, LIDAR_POINT_SIZE);
					}
				}
				ctx.fill();
				ctx.fillStyle = 'blue';
				ctx.beginPath();
				ctx.arc(0, 0, 3, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			}
		}

		function publishTwist() {
			const mag = Math.hypot(currentLinearX, currentLinearY);
			if (mag > maxSpeed && mag > 0) {
				const scale = maxSpeed / mag;
				currentLinearX *= scale;
				currentLinearY *= scale;
			}

			const twist = new ROSLIB.Message({
				linear: { x: currentLinearX, y: currentLinearY, z: 0 },
				angular: { x: 0, y: 0, z: currentAngularZ }
			});
			if (cmdVelTopic) {
				cmdVelTopic.publish(twist);
			}
		}

		function setupControls() {
			const options_h = {
				zone: document.getElementById('joystick_h'),
				mode: 'static',
				position: { left: '50%', top: '50%' },
				color: 'red',
				size: 150
			};
			joystick_h = nipplejs.create(options_h);

			joystick_h.on('move', function (evt, data) {
				const ratio = Math.min(data.distance / distanceFactor, 1.0);
				currentLinearX = Math.sin(data.angle.radian) * maxSpeed * ratio;
				currentLinearY = -Math.cos(data.angle.radian) * maxSpeed * ratio;

				document.getElementById('vx').textContent = currentLinearX.toFixed(2);
				document.getElementById('vy').textContent = currentLinearY.toFixed(2);
			});

			joystick_h.on('end', function () {
				currentLinearX = 0;
				currentLinearY = 0;
				document.getElementById('vx').textContent = '0.00';
				document.getElementById('vy').textContent = '0.00';
			});

			const omegaSlider = document.getElementById('omegaSlider');
			const omegaVal = document.getElementById('omegaVal');
			if (omegaSlider) {
				omegaSlider.addEventListener('input', () => {
					currentAngularZ = parseFloat(omegaSlider.value) * maxTurn;
					omegaVal.textContent = currentAngularZ.toFixed(2);
				});
			}

			setInterval(() => {
				publishTwist();
			}, 50);
		}
		
		// Event Listeners
		window.addEventListener('resize', resizeAllCanvases); 

		window.addEventListener('DOMContentLoaded', () => {
			const robotInput = document.getElementById('robotNumber');
			robotInput.addEventListener('change', (e) => {
				let v = parseInt(e.target.value);
				if (v < 1) v = 1;
				if (v > 9) v = 9;
				e.target.value = v;
			});
		});
	</script>
</body>

</html>
