<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS Web Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .connection-form {
            width: 100%;
            margin-bottom: 20px;
        }

        .joystick-container {
            width: 200px;
            height: 200px;
            background-color: #ddd;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .image-view {
            width: 320px;
            height: 240px;
            background-color: #000;
        }

        .position-display,
        .map-display {
            width: 200px;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
        }

        .map-image {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="connection-form">
        <input type="text" id="map-name" placeholder="Nom del mapa (ex: map)">
        <button onclick="connectToROS()">Connecta</button>
    </div>
    <div class="dashboard">
        <div class="joystick-container" id="joystick_l"></div>
        <div class="joystick-container" id="joystick_h"></div>

        <img class="image-view" id="camera-feed" alt="Camera Feed">
        <div class="position-display">
            <h3>Posició i Orientació</h3>
            <p>X: <span id="position-x">0</span></p>
            <p>Y: <span id="position-y">0</span></p>
            <p>Z_&Theta;: <span id="rotation-z">0</span></p>
        </div>
        <div class="map-display">
            <h3>Mapa</h3>
            <img id="map-image" class="map-image" alt="Mapa">
        </div>
    </div>

    <script>
        let ros;
        let cmdVelTopic;
        let joystick;

        function getRosbridgeAddress() {
            const currentUrl = window.location.href;
            const rosbridgeUrl = currentUrl.replace(/\/webpage\/?$/, '/rosbridge/');
            const rosbridgeAddress = rosbridgeUrl.replace(/^http/, 'ws').replace(/^https/, 'wss');
            return rosbridgeAddress;
        }

        function connectToROS() {
            let mapName = document.getElementById('map-name').value.trim();
            if (!mapName) {
                mapName = "map";
            }

            const rosbridgeAddress = getRosbridgeAddress();
            const mapPath = `maps/${mapName}.png`;

            document.getElementById('map-image').src = mapPath;

            ros = new ROSLIB.Ros({
                url: rosbridgeAddress
            });

            ros.on('connection', function () {
                console.log('Connectat a rosbridge:', rosbridgeAddress);
                setupTopics();
            });

            ros.on('error', function (error) {
                console.error('Error de connexió:', error);
            });

            ros.on('close', function () {
                console.log('Connexió tancada.');
            });
        }

        function quaternionToYaw(orientation) {
            const q = orientation;
            // Yaw (Z) calculation
            const siny_cosp = 2 * (q.w * q.z + q.x * q.y);
            const cosy_cosp = 1 - 2 * (q.y * q.y + q.z * q.z);
            const yaw = Math.atan2(siny_cosp, cosy_cosp);
            return yaw;
        }

        function setupTopics() {
            cmdVelTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/cmd_vel',
                messageType: 'geometry_msgs/Twist'
            });

            const imageTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/camera1/image_raw/compressed',
                messageType: 'sensor_msgs/CompressedImage'
            });

            imageTopic.subscribe(function (message) {
                // console.log("Imatge rebuda");
                document.getElementById('camera-feed').src = "data:image/jpeg;base64," + message.data;
            });

            const odomTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/odom',
                messageType: 'nav_msgs/Odometry'
            });

            odomTopic.subscribe(function (message) {
                // console.log("Odometria rebuda", message.pose.pose.position);
                document.getElementById('position-x').textContent = message.pose.pose.position.x.toFixed(2);
                document.getElementById('position-y').textContent = message.pose.pose.position.y.toFixed(2);

                // Get Yaw from the Quaternion orientation
                const yaw = quaternionToYaw(message.pose.pose.orientation);
                document.getElementById('rotation-z').textContent = yaw.toFixed(2);
            });


            setupJoysticks();
        }

        const maxSpeed = 1.0;
        const maxTurn = 1.0;
        const distanceFactor = 75;

        let currentLinearX = 0;
        let currentLinearY = 0;
        let currentAngularZ = 0;

        function publishTwist() {
            const twist = new ROSLIB.Message({
                linear: {
                    x: currentLinearX,
                    y: currentLinearY,
                    z: 0
                },
                angular: {
                    x: 0,
                    y: 0,
                    z: currentAngularZ
                }
            });
            if (cmdVelTopic) {
                cmdVelTopic.publish(twist);
            }
        }

        function setupJoysticks() {
            const options_l = { // Linear X and Angular Z
                zone: document.getElementById('joystick_l'),
                mode: 'static',
                position: {
                    left: '50%',
                    top: '50%'
                },
                color: 'blue',
                size: 150
            };

            const options_h = { // Linear Y (strafe)
                zone: document.getElementById('joystick_h'),
                mode: 'static',
                position: {
                    left: '50%',
                    top: '50%'
                },
                color: 'red',
                size: 150
            };

            const joystick_l = nipplejs.create(options_l);
            const joystick_h = nipplejs.create(options_h);


            joystick_l.on('move', function (evt, data) {
                // Linear X (Forward/Backward) is based on the vertical component (sin(angle))
                currentLinearX = Math.sin(data.angle.radian) * maxSpeed * data.distance / distanceFactor;
                // Angular Z (Turning/Yaw) is based on the horizontal component (cos(angle))
                currentAngularZ = -Math.cos(data.angle.radian) * maxTurn * data.distance / distanceFactor;
                publishTwist();
            });

            joystick_l.on('end', function () {
                // Stop linear X and angular Z
                currentLinearX = 0;
                currentAngularZ = 0;
                publishTwist();
            });

            joystick_h.on('move', function (evt, data) {
                // Linear Y (Strafe Left/Right). Use the horizontal component (X-axis)
                currentLinearY = -Math.cos(data.angle.radian) * maxSpeed * data.distance / distanceFactor;

                publishTwist();
            });

            joystick_h.on('end', function () {
                // Stop Linear Y motion
                currentLinearY = 0;
                publishTwist();
            });
        }
    </script>
</body>

</html>
